<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Wireframe das três telas do Catálogo Toyota</title>
  <desc>Esboço de baixa fidelidade das telas de catálogo, ficha do modelo e agendamento de test-drive.</desc>

  <rect width="1200" height="700" fill="#FFFFFF"/>

  <text x="600" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">Wireframe — Catálogo Toyota</text>
  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">Esboço de baixa fidelidade, layout desktop</text>

  <!-- ====================== TELA 1: CATÁLOGO ====================== -->
  <text x="200" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">1. Catálogo — index.html</text>
  <rect x="20" y="100" width="360" height="560" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <rect x="20" y="100" width="360" height="42" fill="#EFEFEF" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="34" y="112" width="70" height="18" fill="#CFCFCF" stroke="#9B9B9B" stroke-width="0.8"/>
  <text x="69" y="125" text-anchor="middle" font-size="9" fill="#4A4A4A">marca</text>
  <rect x="200" y="114" width="52" height="14" fill="#BDBDBD" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="258" y="114" width="52" height="14" fill="#DEDEDE" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="316" y="114" width="52" height="14" fill="#DEDEDE" stroke="#9B9B9B" stroke-width="0.8"/>
  <text x="200" y="158" font-size="9" fill="#8A8A8A">header + nav (3 itens, item atual marcado)</text>

  <rect x="34" y="168" width="332" height="78" fill="#F7F7F7" stroke="#C4C4C4" stroke-width="0.8" stroke-dasharray="4 3"/>
  <rect x="48" y="182" width="190" height="16" fill="#BDBDBD"/>
  <rect x="48" y="206" width="250" height="9" fill="#DEDEDE"/>
  <rect x="48" y="221" width="210" height="9" fill="#DEDEDE"/>
  <text x="352" y="242" text-anchor="end" font-size="9" fill="#8A8A8A">h1 + subtítulo (compacto)</text>

  <text x="34" y="266" font-size="10" fill="#4A4A4A">section: grade de modelos</text>

  <g stroke="#9B9B9B" stroke-width="0.8" fill="#FFFFFF">
    <rect x="34" y="276" width="158" height="130"/>
    <rect x="208" y="276" width="158" height="130"/>
    <rect x="34" y="420" width="158" height="130"/>
    <rect x="208" y="420" width="158" height="130"/>
  </g>
  <g fill="#E4E4E4">
    <rect x="42" y="284" width="142" height="62"/>
    <rect x="216" y="284" width="142" height="62"/>
    <rect x="42" y="428" width="142" height="62"/>
    <rect x="216" y="428" width="142" height="62"/>
  </g>
  <g fill="#8A8A8A" font-size="9">
    <text x="113" y="319" text-anchor="middle">figure / img</text>
    <text x="287" y="319" text-anchor="middle">figure / img</text>
    <text x="113" y="463" text-anchor="middle">figure / img</text>
    <text x="287" y="463" text-anchor="middle">figure / img</text>
  </g>
  <g fill="#BDBDBD">
    <rect x="42" y="354" width="96" height="10"/><rect x="42" y="370" width="130" height="8"/><rect x="42" y="384" width="70" height="8"/>
    <rect x="216" y="354" width="96" height="10"/><rect x="216" y="370" width="130" height="8"/><rect x="216" y="384" width="70" height="8"/>
    <rect x="42" y="498" width="96" height="10"/><rect x="42" y="514" width="130" height="8"/><rect x="42" y="528" width="70" height="8"/>
    <rect x="216" y="498" width="96" height="10"/><rect x="216" y="514" width="130" height="8"/><rect x="216" y="528" width="70" height="8"/>
