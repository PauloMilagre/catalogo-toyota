  <text x="600" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">2. Modelo — modelo.html</text>
  <rect x="420" y="100" width="360" height="560" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <rect x="420" y="100" width="360" height="42" fill="#EFEFEF" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="434" y="112" width="70" height="18" fill="#CFCFCF" stroke="#9B9B9B" stroke-width="0.8"/>
  <text x="469" y="125" text-anchor="middle" font-size="9" fill="#4A4A4A">marca</text>
  <rect x="600" y="114" width="52" height="14" fill="#DEDEDE" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="658" y="114" width="52" height="14" fill="#BDBDBD" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="716" y="114" width="52" height="14" fill="#DEDEDE" stroke="#9B9B9B" stroke-width="0.8"/>

  <rect x="434" y="156" width="332" height="150" fill="#E4E4E4" stroke="#9B9B9B" stroke-width="0.8"/>
  <text x="600" y="236" text-anchor="middle" font-size="10" fill="#6B6B6B">figure: foto do modelo</text>
  <text x="766" y="322" text-anchor="end" font-size="9" fill="#8A8A8A">figcaption</text>

  <rect x="434" y="332" width="200" height="16" fill="#BDBDBD"/>
  <text x="766" y="345" text-anchor="end" font-size="9" fill="#8A8A8A">h1 do modelo</text>
  <g fill="#DEDEDE">
    <rect x="434" y="360" width="332" height="9"/>
    <rect x="434" y="375" width="332" height="9"/>
    <rect x="434" y="390" width="240" height="9"/>
  </g>

  <rect x="434" y="416" width="332" height="132" fill="#F7F7F7" stroke="#9B9B9B" stroke-width="0.8"/>
