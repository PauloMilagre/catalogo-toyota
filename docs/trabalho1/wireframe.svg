  <g fill="#DEDEDE">
    <rect x="448" y="448" width="120" height="8"/><rect x="620" y="448" width="132" height="8"/>
    <rect x="448" y="470" width="120" height="8"/><rect x="620" y="470" width="132" height="8"/>
    <rect x="448" y="492" width="120" height="8"/><rect x="620" y="492" width="132" height="8"/>
    <rect x="448" y="514" width="120" height="8"/><rect x="620" y="514" width="132" height="8"/>
  </g>
  <text x="766" y="566" text-anchor="end" font-size="9" fill="#8A8A8A">dl / dt / dd</text>

  <rect x="434" y="574" width="170" height="30" fill="#8A8A8A"/>
  <text x="519" y="593" text-anchor="middle" font-size="10" fill="#FFFFFF">Agendar test-drive</text>

  <rect x="420" y="618" width="360" height="42" fill="#EFEFEF" stroke="#9B9B9B" stroke-width="0.8"/>
  <text x="600" y="643" text-anchor="middle" font-size="10" fill="#6B6B6B">footer</text>

  <!-- ====================== TELA 3: AGENDAR ====================== -->
  <text x="1000" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">3. Agendar — agendar.html</text>
  <rect x="820" y="100" width="360" height="560" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <rect x="820" y="100" width="360" height="42" fill="#EFEFEF" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="834" y="112" width="70" height="18" fill="#CFCFCF" stroke="#9B9B9B" stroke-width="0.8"/>
  <text x="869" y="125" text-anchor="middle" font-size="9" fill="#4A4A4A">marca</text>
  <rect x="1000" y="114" width="52" height="14" fill="#DEDEDE" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="1058" y="114" width="52" height="14" fill="#DEDEDE" stroke="#9B9B9B" stroke-width="0.8"/>
  <rect x="1116" y="114" width="52" height="14" fill="#BDBDBD" stroke="#9B9B9B" stroke-width="0.8"/>

  <rect x="834" y="162" width="220" height="16" fill="#BDBDBD"/>
  <text x="1166" y="175" text-anchor="end" font-size="9" fill="#8A8A8A">h1 da página</text>
  <rect x="834" y="190" width="300" height="9" fill="#DEDEDE"/>

  <g stroke="#9B9B9B" stroke-width="0.8" fill="#FFFFFF">
    <rect x="834" y="232" width="332" height="30"/>
    <rect x="834" y="296" width="332" height="30"/>
    <rect x="834" y="360" width="332" height="30"/>
    <rect x="834" y="424" width="332" height="30"/>
    <rect x="834" y="488" width="332" height="30"/>
  </g>
  <g fill="#BDBDBD">
    <rect x="834" y="216" width="70" height="9"/>
    <rect x="834" y="280" width="52" height="9"/>
    <rect x="834" y="344" width="86" height="9"/>
    <rect x="834" y="408" width="64" height="9"/>
    <rect x="834" y="472" width="96" height="9"/>
  </g>
  <text x="1166" y="225" text-anchor="end" font-size="9" fill="#8A8A8A">label acima do campo, sempre visível</text>

  <rect x="834" y="540" width="140" height="32" fill="#8A8A8A"/>
  <text x="904" y="560" text-anchor="middle" font-size="10" fill="#FFFFFF">Enviar</text>
  <text x="1166" y="560" text-anchor="end" font-size="9" fill="#8A8A8A">um único botão de envio</text>

  <rect x="820" y="618" width="360" height="42" fill="#EFEFEF" stroke="#9B9B9B" stroke-width="0.8"/>
  <text x="1000" y="643" text-anchor="middle" font-size="10" fill="#6B6B6B">footer</text>

  <text x="20" y="688" font-size="10" fill="#8A8A8A">Fluxo principal: catálogo → modelo → agendar (2 cliques). O item de menu "Agendar" encurta para 1 clique a partir de qualquer página.</text>
</svg>
